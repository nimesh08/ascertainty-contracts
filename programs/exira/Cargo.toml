[package]
name = "exira"
version = "0.2.0"
description = "Exira: savings-backed efficiency financing on Solana"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "exira"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]
anchor-debug = []
custom-heap = []
custom-panic = []

[dependencies]
anchor-lang = { version = "1.0.0", features = ["init-if-needed"] }
anchor-spl = "1.0.0"

[dev-dependencies]
litesvm = "0.10.0"
solana-message = "3.1.0"
solana-transaction = "3.0.2"
solana-signer = "3.0.0"
solana-keypair = "3.0.1"
solana-pubkey = "3.0.0"
solana-instruction = "3.0.0"
solana-program-option = "3.0.0"
spl-token = "7"
spl-associated-token-account = "6"

[lints]
workspace = true
